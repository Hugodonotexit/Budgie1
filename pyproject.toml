[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "budgie"
version = "0.1.0"
description = "Budgie: a decoder-only transformer with local, dilated and global attention, in Hugging Face format"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hugodonotexit" }]
dependencies = [
    "torch>=2.6",
    "transformers>=5.15",
    "safetensors",
]

[project.urls]
Source = "https://github.com/Hugodonotexit/Budgie1"
Models = "https://huggingface.co/Hugodonotexit"

[project.optional-dependencies]
# CUDA kernel for the depthwise causal convs; without it the model uses an equivalent PyTorch path.
fast = ["causal-conv1d>=1.6"]
# Liger (RMSNorm, RoPE, fused cross entropy) and xformers (attention) kernels, switched on with budgie.kernels.configure(...).
kernels = ["liger-kernel>=0.8", "xformers>=0.0.35"]
dev = ["pytest"]

# The repository root *is* the model directory (flat modules, so that trust_remote_code can copy
# them next to a checkpoint), and `pip install` exposes it as the package `budgie`.
[tool.setuptools]
packages = ["budgie"]
package-dir = { budgie = "." }

[tool.setuptools.package-data]
budgie = ["config.json", "generation_config.json", "tokenizer/*"]
